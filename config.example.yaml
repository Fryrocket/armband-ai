# Copy to config.yaml and edit for your Pi / network
# cp config.example.yaml config.yaml

mqtt:
  broker: "localhost"          # or the Pi's own IP / hostname if broker is elsewhere
  port: 1883
  topic: "armband/ppg"         # must match firmware MQTT_TOPIC
  client_id: "armband_ai_logger"
  username: ""                 # leave empty if no auth
  password: ""
  keepalive: 60

database:
  path: "data/armband_data.db"

logging:
  level: "INFO"                # DEBUG | INFO | WARNING | ERROR
  file: "logs/mqtt_logger.log" # set to null to disable file logging

calibration:
  window_seconds: 180          # ± seconds around each Libre reading
  prefer_still: true           # prefer non-moving armband samples when available
  min_quality: 50              # drop pairs with quality score below this (0-100)
  min_still_fraction: 0.6      # drop pairs with still_fraction below this

inference:
  interval_seconds: 30         # background service loop period
  window_minutes: 5            # feature / quality lookback
  model_path: "models/baseline.json"

hailo:
  # Confirmed silicon: HNC18BI11BH (Hailo-8 industrial, 26 TOPS)
  # Run: python scripts/hailo_identify.py --save models/hailo_device.json
  device_json: "models/hailo_device.json"
  hef_path: ""                 # path to compiled .hef once you have a model
  feature_window_minutes: 5    # default lookback for feature vectors
