# Copy to config.yaml and edit for your Pi / network
# cp config.example.yaml config.yaml
#
# This Pi boots from a ~250 GB SSD. Relative paths resolve under the repo root.
# Confirm with: pwd && df -h && lsblk

mqtt:
  broker: "localhost"
  port: 1883
  topic: "armband/ppg"
  client_id: "armband_ai_logger"
  username: ""
  password: ""
  keepalive: 60

database:
  path: "data/armband_data.db"

logging:
  level: "INFO"
  file: "logs/mqtt_logger.log"
  max_bytes: 2097152
  backup_count: 5
  # Default: zstd → mqtt_logger.log.1.zst (install: sudo apt install zstd).
  # If the zstd binary is missing, rotation still runs and keeps an uncompressed .1 file.
  # Alternatives: gzip | none
  compression: zstd

calibration:
  window_seconds: 180
  prefer_still: true
  min_quality: 50
  min_still_fraction: 0.6
  # Consecutive still + optically stable samples required (0 = disabled).
  # Recommend 10–15 under real armband contact noise.
  min_clean_streak: 0

inference:
  interval_seconds: 30
  window_minutes: 5
  model_path: "models/baseline.json"
  multifeature_path: "models/multifeature.json"

hailo:
  device_json: "models/hailo_device.json"
  # Set when you have a compiled HEF (see docs/HAILO_MODEL.md)
  hef_path: ""
  # Optional z-score stats from scripts/train_mlp_onnx.py
  norm_path: ""
  feature_window_minutes: 5
