# Copy to config.yaml and edit for your Pi / network
# cp config.example.yaml config.yaml
#
# This Pi boots from a ~250 GB SSD. Relative paths resolve under the repo root
# (clone armband-ai onto the SSD and leave as-is). Absolute paths work too, e.g.:
#   database.path: "/home/pi/armband-ai/data/armband_data.db"
# Confirm with: pwd && df -h && lsblk

mqtt:
  broker: "localhost"
  port: 1883
  topic: "armband/ppg"
  client_id: "armband_ai_logger"
  username: ""
  password: ""
  keepalive: 60

database:
  path: "data/armband_data.db"

logging:
  level: "INFO"
  file: "logs/mqtt_logger.log"
  # RotatingFileHandler (Python logger)
  max_bytes: 2097152      # 2 MiB per file
  backup_count: 5         # mqtt_logger.log.1 .. .5

calibration:
  window_seconds: 180
  prefer_still: true
  min_quality: 50
  min_still_fraction: 0.6

inference:
  interval_seconds: 30
  window_minutes: 5
  model_path: "models/baseline.json"
  multifeature_path: "models/multifeature.json"

hailo:
  device_json: "models/hailo_device.json"
  hef_path: ""
  feature_window_minutes: 5
