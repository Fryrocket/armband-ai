# Copy to config.yaml and edit for your Pi / network
# cp config.example.yaml config.yaml
#
# Pi 5 with 250 GB SSD: put SQLite + logs on the SSD (less SD wear).
# Example absolute paths if SSD is at /mnt/ssd:
#   database.path: "/mnt/ssd/armband/data/armband_data.db"
#   logging.file:  "/mnt/ssd/armband/logs/mqtt_logger.log"
# Relative paths resolve under the repo root (fine if the repo itself lives on the SSD).

mqtt:
  broker: "localhost"
  port: 1883
  topic: "armband/ppg"
  client_id: "armband_ai_logger"
  username: ""
  password: ""
  keepalive: 60

database:
  path: "data/armband_data.db"

logging:
  level: "INFO"
  file: "logs/mqtt_logger.log"

calibration:
  window_seconds: 180
  prefer_still: true
  min_quality: 50
  min_still_fraction: 0.6

inference:
  interval_seconds: 30
  window_minutes: 5
  model_path: "models/baseline.json"
  multifeature_path: "models/multifeature.json"

hailo:
  device_json: "models/hailo_device.json"
  hef_path: ""
  feature_window_minutes: 5
