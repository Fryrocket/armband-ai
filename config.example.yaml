# Copy to config.yaml and edit for your Pi / network
# cp config.example.yaml config.yaml
#
# This Pi boots from a ~250 GB SSD. Relative paths resolve under the repo root.
# Confirm with: pwd && df -h && lsblk

mqtt:
  broker: "localhost"
  port: 1883
  topic: "armband/ppg"
  # iOS companion batch dump (armband-ios publishes here)
  batch_topic: "armband/ios/batch"
  # ACK so the phone only marks records synced after confirmed insert
  batch_ack_topic: "armband/ios/batch/ack"
  client_id: "armband_ai_logger"
  username: ""
  password: ""
  keepalive: 60

database:
  path: "data/armband_data.db"

logging:
  level: "INFO"
  file: "logs/mqtt_logger.log"
  # Separate file: logger and inference are separate processes and must not
  # share a RotatingFileHandler target.
  inference_file: "logs/inference.log"
  max_bytes: 2097152
  backup_count: 5
  # Default: zstd → mqtt_logger.log.1.zst (install: sudo apt install zstd).
  # If the zstd binary is missing, rotation still runs and keeps an uncompressed .1 file.
  # Alternatives: gzip | none
  compression: zstd

# Recommended build defaults (match README / SETUP_FULL).
# Loosen only for desk bring-up if you have almost no still pairs yet.
calibration:
  window_seconds: 180
  prefer_still: true
  min_quality: 60
  min_still_fraction: 0.7
  # Consecutive still + optically stable samples (0 = disabled).
  # 10–15 under real armband contact noise; start at 10 after first good pairs.
  min_clean_streak: 10

inference:
  interval_seconds: 30
  window_minutes: 5
  model_path: "models/baseline.json"
  multifeature_path: "models/multifeature.json"

hailo:
  device_json: "models/hailo_device.json"
  # Set when you have a compiled HEF (see docs/HAILO_MODEL.md)
  hef_path: ""
  # Optional z-score stats from scripts/train_mlp_onnx.py
  norm_path: ""
  feature_window_minutes: 5
