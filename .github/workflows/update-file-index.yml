name: Update File Index

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ${{ env.pythonLocation }}
          key: ${{ runner.os }}-pip-py3.12-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-py3.12-
            ${{ runner.os }}-pip-

      - name: Cache statistics
        run: |
          echo "### Cache statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.cache-pip.outputs.cache-hit }}" = "true" ]; then
            echo "**pip cache: HIT** ✅" >> $GITHUB_STEP_SUMMARY
            echo "pip cache: HIT"
          else
            echo "**pip cache: MISS** (cold start)" >> $GITHUB_STEP_SUMMARY
            echo "pip cache: MISS (cold start)"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Runner OS | \`${{ runner.os }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | 3.12 |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache key | \`${{ runner.os }}-pip-py3.12-...\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache hit | \`${{ steps.cache-pip.outputs.cache-hit }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Regenerate File index
        run: |
          if [ -f scripts/update_file_index.py ]; then
            python3 scripts/update_file_index.py
          else
            echo "scripts/update_file_index.py not found – skipping"
            exit 0
          fi

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: auto-update File index [skip ci]"
          git push
